[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memweave"
version = "0.1.0"
description = "Transport-neutral memory infrastructure for agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3.0", "SQLAlchemy>=2.0,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
